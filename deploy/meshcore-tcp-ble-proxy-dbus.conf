<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow the meshcore-tcp-ble-proxy service account to register D-Bus objects
       and communicate with BlueZ, which is required by the bless library
       to create a GATT peripheral via the BlueZ D-Bus API. -->
  <policy user="meshcore-tcp-ble-proxy">
    <allow own_prefix="org.meshcore.proxy"/>
    <allow send_destination="org.bluez"/>
    <allow receive_sender="org.bluez"/>
  </policy>
</busconfig>
